# No escape delay (fix for VSCode/Cursor)
set -s escape-time 50

# Tmux Configuration - Clean Start
# Building step by step towards omerxx-style Catppuccin theme

# -- general -------------------------------------------------------------------

set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

# Use default prefix (Ctrl+b)
set -g prefix C-b

# Start window/pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Disable automatic window renaming (allows manual renames to stick)
set -g automatic-rename off
set -g allow-rename off

# Increase history limit
set -g history-limit 1000000

# Enable mouse support
set -g mouse on

# Use vi keybindings in copy mode
setw -g mode-keys vi

# Status bar at bottom (your preference)
set -g status-position bottom

# Use system clipboard
set -g set-clipboard on

# -- key bindings --------------------------------------------------------------

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# -- plugins -------------------------------------------------------------------

# TPM (Tmux Plugin Manager) and Catppuccin
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Configure the catppuccin plugin BEFORE loading it
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Customize window text to show window name (allows manual renaming)
set -g @catppuccin_window_text " #{window_name}"
set -g @catppuccin_window_current_text " #{window_name}"

# Customize date_time to show just time
set -g @catppuccin_date_time_text " %H:%M"

set -g @catppuccin_git_text "#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null)"

set -g @catppuccin_status_default "off"



# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"

# add git branch info to the right side (hard coded to mocha theme colors)
set -ag status-right "#[fg=#a6e3a1,bg=#313244]#[fg=#11111b,bg=#a6e3a1]  #[fg=#cdd6f4,bg=#313244] #(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=#cdd6f4,bg=#313244]"

set -agF status-right "#{E:@catppuccin_status_git}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_date_time}"



# Load plugins directly (more reliable than TPM auto-loading)
# Catppuccin theme - MUST load first to set up theme
run '~/.tmux/plugins/catppuccin/catppuccin.tmux'

# Other plugins
# run '~/.tmux/plugins/tmux-sensible/sensible.tmux'
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
run '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
run '~/.tmux/plugins/tmux-continuum/continuum.tmux'
run '~/.tmux/plugins/tmux-yank/yank.tmux'

# Initialize TMUX plugin manager last (for key bindings like Ctrl+b I)
run '~/.tmux/plugins/tpm/tpm'
